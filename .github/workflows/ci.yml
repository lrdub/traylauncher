name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to change the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: python -m py_compile traylauncher.py
      - run: python -m pytest -q

  # Builds the program and installer the same way a release does, without publishing,
  # so Windows-only problems show up before a tag is pushed.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-lock.txt
      - run: python -m pytest -q
      - name: Build program
        run: |
          python traylauncher.py --make-icon
          python -m PyInstaller --noconsole --onedir --noconfirm --name TrayLauncher --icon icon.ico traylauncher.py
      - name: Check the built program has all its libraries
        shell: pwsh
        run: |
          $p = Start-Process dist\TrayLauncher\TrayLauncher.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Built program failed its self test (exit code $($p.ExitCode))" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0" installer\TrayLauncher.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
